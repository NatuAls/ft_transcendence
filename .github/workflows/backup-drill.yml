name: Ensayo de restauración

# =============================================================================
#  Tarea DevOps 8 — "probar periódicamente una restauración completa en un
#  entorno aislado y registrar RPO/RTO".
#
#  Esto es lo que separa "tenemos copias" de "sabemos recuperarnos". El ensayo
#  levanta un PostgreSQL efímero en una red interna del servidor, restaura ahí
#  la última copia CIFRADA, cuenta filas, comprueba que el historial de
#  migraciones de Prisma está completo y que todos los adjuntos vivos de la
#  base están dentro del archivo. No toca ni staging ni producción.
#
#  Se ejecuta los lunes a las 05:30 (Europe/Madrid = 03:30 UTC), antes de que
#  nadie use el sistema, y se puede lanzar a mano desde la pestaña Actions.
#
#  El programado ensaya LOS DOS entornos, uno detrás de otro. Hasta el 09/10
#  sólo ensayaba prod (`inputs.entorno || 'prod'`: en un `schedule` no hay
#  inputs), así que EnsayoDeRestauracionAntiguo de staging sonaba siempre a
#  los diez días del último ensayo lanzado a mano. A mano se elige uno.
#
#  OJO: el programado corre sobre la rama por defecto (main). El restore.sh
#  que ejecuta es el de main, no el de develop.
#
#  Si falla, falla ruidosamente: el job termina en rojo y Prometheus además
#  levanta EnsayoDeRestauracionFallido a partir del fichero de métricas que
#  deja el propio script.
# =============================================================================

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno cuya copia se ensaya
        type: choice
        options: [prod, staging]
        default: prod
      copia:
        description: 'Ruta de la copia (vacío = la última)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ensayo:
    name: Restaurar la última copia en un entorno aislado (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # De uno en uno: cada ensayo levanta un PostgreSQL con 2 GB de tmpfs en
      # la misma instancia ARM que sirve los dos entornos.
      max-parallel: 1
      matrix:
        entorno: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.entorno) || '["prod","staging"]') }}
    # Por entorno: un ensayo de prod no espera a uno de staging.
    concurrency:
      group: backup-drill-${{ matrix.entorno }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar el ensayo en el servidor
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENTORNO: ${{ matrix.entorno }}
          COPIA: ${{ inputs.copia }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deployer
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 25m
          envs: ENTORNO,COPIA,GH_REPO,GH_TOKEN,GIT_SHA
          script: |
            set -euo pipefail
            cd "/opt/helpdesk/${ENTORNO}"

            # El script se trae del commit exacto, igual que hace el
            # despliegue: así el ensayo prueba la versión del repositorio y no
            # una copia vieja que quedó en el servidor.
            mkdir -p scripts
            curl -sS -f -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o scripts/restore.sh \
              "https://api.github.com/repos/${GH_REPO}/contents/scripts/restore.sh?ref=${GIT_SHA}"

            bash scripts/restore.sh --drill ${COPIA:+"$COPIA"}

      - name: Recoger el informe del ensayo
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENTORNO: ${{ matrix.entorno }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deployer
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: ENTORNO
          script: |
            set -euo pipefail
            # Desde el 04/10 el informe se escribe en drills/, fuera de la
            # copia: una copia es inmutable y su directorio es de root.
            # Se mira también en backups/ por si queda alguno antiguo.
            latest="$(find "/opt/helpdesk/${ENTORNO}/drills" "/opt/helpdesk/${ENTORNO}/backups" \
              -name 'RESTORE-DRILL-*.txt' 2>/dev/null | sort | tail -1 || true)"
            if [ -n "$latest" ]; then cat "$latest"; else echo "sin informe"; fi

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Ensayo de restauración — ${{ matrix.entorno }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Resultado | ${{ job.status }} |"
            echo "| Fecha | $(date -u +'%Y-%m-%d %H:%M UTC') |"
            echo ""
            echo "El detalle (RTO medido, filas por tabla, coherencia de adjuntos) está en el log del paso anterior y en \`drills/RESTORE-DRILL-*.txt\` del servidor."
          } >> "$GITHUB_STEP_SUMMARY"

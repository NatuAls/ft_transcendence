name: Deploy Production

# =============================================================================
#  Despliegue del entorno de producción.
#
#  Barreras, en orden:
#
#    1. El job `ci` vuelve a ejecutar la batería completa sobre el commit de
#       merge real, por si alguien empujó directamente o la rama estaba
#       desactualizada respecto a main. Esto vive en el repositorio y no
#       depende de ningún ajuste.
#    2. El job `gate` (scripts/ci/prod-gate.mjs) exige que el commit venga de
#       una PR fusionada con al menos una aprobación de OTRA persona sobre su
#       último commit —y, en una liberación manual, que quien la lanza esté en
#       la variable PROD_APPROVERS—. Es el equivalente EN FICHERO de la
#       aprobación del entorno PROD y del ruleset «PR aprobada»: esos son
#       ajustes del repositorio que sólo un administrador puede poner, y este
#       job garantiza lo mismo aunque no estén. También vive en el repositorio.
#    3. Si además el entorno PROD tiene Required Reviewers (Settings ->
#       Environments, requiere administrador), GitHub pausa en
#       `build-and-deploy` y espera un "Approve and deploy". Es un extra, no
#       un requisito: sin él, 1 y 2 ya impiden desplegar algo sin revisar.
#
#  Variables de repositorio (Settings -> Secrets and variables -> Actions ->
#  Variables; con permiso de escritura basta):
#    PROD_APPROVERS   logins separados por comas que pueden liberar a mano y
#                     cuya aprobación cuenta en la PR (opcional para la PR,
#                     obligatoria para la liberación manual).
#    PROD_GATE=off    desactiva la exigencia de PR aprobada. SÓLO para un
#                     repositorio personal de pruebas con una única persona.
# =============================================================================

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ENVIRONMENT: prod

jobs:
  # ---------------------------------------------------------------------------
  # PUERTA DE CALIDAD. Se ejecuta ANTES de pedir la aprobación manual.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Un workflow llamado no puede tener MÁS permisos que quien lo llama, así
    # que `pull-requests: read` tiene que concederse también aquí; si no,
    # gitleaks se queda sin él dentro del despliegue.
    permissions:
      contents: read
      pull-requests: read

  # ---------------------------------------------------------------------------
  # PUERTA DE PRODUCCIÓN (en fichero). Ver scripts/ci/prod-gate.mjs.
  # Va después del CI y antes de construir: si no hay aprobación, no se gasta
  # ni un minuto de QEMU. Lee PR y revisiones con el GITHUB_TOKEN del run.
  # ---------------------------------------------------------------------------
  gate:
    name: Puerta de producción (PR aprobada o liberación autorizada)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/prod-gate.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comprobar PR aprobada / liberación autorizada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_APPROVERS: ${{ vars.PROD_APPROVERS }}
          PROD_GATE: ${{ vars.PROD_GATE }}
        run: node scripts/ci/prod-gate.mjs

  # ---------------------------------------------------------------------------
  # CONSTRUCCIÓN Y DESPLIEGUE, tras el CI y la puerta (y la aprobación del
  # entorno PROD si está configurada).
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Construir y desplegar (requiere aprobación)
    needs: [ci, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: PROD
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calcular metadatos de la release
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/helpdesk-api-prod:${{ github.sha }}
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/helpdesk-web-prod:${{ github.sha }}
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,mode=max,scope=web-prod

      # El script remoto hace: copia previa -> .env -> pull -> up -> espera al
      # healthcheck -> smoke test -> ROLLBACK automático si algo de eso falla.
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_NAME: prod
          DEPLOY_DIR: /opt/helpdesk/prod
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GHCR_OWNER: ${{ steps.meta.outputs.owner }}
          GIT_SHA: ${{ github.sha }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
          # Opcional (auditoría B4): contraseña del rol helpdesk_app. Vacío = la
          # aplicación sigue conectando como el propietario de la base.
          DB_APP_PASSWORD: ${{ secrets.PROD_DB_APP_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.PROD_BACKUP_KEY }}
          RCLONE_REMOTE: ${{ vars.PROD_RCLONE_REMOTE }}
          METRICS_TOKEN: ${{ secrets.PROD_METRICS_TOKEN }}
          JWT_ACCESS_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.PROD_JWT_REFRESH_SECRET || secrets.PROD_JWT_SECRET }}
          PASSWORD_PEPPER: ${{ secrets.PROD_PEPPER }}
          # Estos cuatro valores NO son sensibles y su sitio es la pestaña
          # "Variables". Pero se acepta también la pestaña "Secrets" como
          # respaldo: es una confusión fácil de cometer y el despliegue no
          # debería caerse por en qué pestaña se guardó un nombre de dominio.
          CORS_ORIGINS: ${{ vars.PROD_CORS_ORIGINS || secrets.PROD_CORS_ORIGINS }}
          SMTP_HOST: ${{ vars.PROD_SMTP_HOST || secrets.PROD_SMTP_HOST }}
          SMTP_PORT: ${{ vars.PROD_SMTP_PORT || secrets.PROD_SMTP_PORT }}
          MAIL_FROM: ${{ vars.PROD_MAIL_FROM || secrets.PROD_MAIL_FROM }}
          # Opcional: correo del primer GLOBAL_ADMIN (ver compose.prod.yml).
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.PROD_BOOTSTRAP_ADMIN_EMAIL }}
          APP_VERSION: ${{ github.ref_name }}-${{ github.run_number }}
          LOG_LEVEL: info
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deployer
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 20m
          envs: ENV_NAME,DEPLOY_DIR,GH_REPO,GH_TOKEN,GH_ACTOR,GHCR_OWNER,GIT_SHA,DB_USER,DB_PASSWORD,DB_NAME,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,PASSWORD_PEPPER,CORS_ORIGINS,SMTP_HOST,SMTP_PORT,MAIL_FROM,APP_VERSION,LOG_LEVEL,BACKUP_ENCRYPTION_KEY,RCLONE_REMOTE,METRICS_TOKEN,BOOTSTRAP_ADMIN_EMAIL,DB_APP_PASSWORD
          script: |
            set -euo pipefail
            # /opt pertenece a root. `deployer` no tiene sudo, así que el
            # directorio se prepara UNA vez en el servidor:
            #   sudo mkdir -p /opt/helpdesk/staging /opt/helpdesk/prod
            #   sudo chown -R deployer:deployer /opt/helpdesk
            if ! mkdir -p "$DEPLOY_DIR/scripts/deploy" 2>/dev/null; then
              echo "ERROR: $(id -un) no puede crear $DEPLOY_DIR. Ver doc/RUNBOOK.md §11 (Alta del host)." >&2
              exit 1
            fi
            cd "$DEPLOY_DIR"
            curl -sS -f -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o scripts/deploy/remote-deploy.sh \
              "https://api.github.com/repos/${GH_REPO}/contents/scripts/deploy/remote-deploy.sh?ref=${GIT_SHA}"
            bash scripts/deploy/remote-deploy.sh

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Despliegue de producción"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Imagen API | \`helpdesk-api-prod:${{ github.sha }}\` |"
            echo "| Imagen Web | \`helpdesk-web-prod:${{ github.sha }}\` |"
            echo "| Construida | ${{ steps.meta.outputs.build_time }} |"
            echo "| Aprobado por | ${{ github.actor }} |"
            echo "| Resultado | ${{ job.status }} |"
            echo ""
            echo "Rollback: Actions -> este workflow -> un run anterior correcto -> **Re-run all jobs**."
          } >> "$GITHUB_STEP_SUMMARY"

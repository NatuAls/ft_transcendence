services:
  db:
    image: postgres:15-alpine
    container_name: dev_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mi_usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi_password}
      POSTGRES_DB: ${POSTGRES_DB:-mi_base_datos}
    ports:
      - '5432:5432'
    networks:
      - dev_network
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dev_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    networks:
      - dev_network
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    # Fijada por versión: `:latest` haría que dos desarrolladores levantasen
    # servidores de correo distintos sin enterarse (tarea DevOps 2).
    image: axllent/mailpit:v1.28.3
    container_name: dev_mailpit
    restart: unless-stopped
    networks:
      - dev_network
    ports:
      - '1025:1025' # Servidor SMTP
      - '8025:8025' # Interfaz web de correos

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    container_name: dev_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    networks:
      - dev_network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mi_usuario}:${POSTGRES_PASSWORD:-mi_password}@db:5432/${POSTGRES_DB:-mi_base_datos}?schema=public
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev_access_secret_change_me_please_32}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me_please_32}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-dev_pepper_change_me}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - MAIL_FROM=${MAIL_FROM:-HelpDesk Lite <no-reply@helpdesk.local>}
      - UPLOAD_DIR=${UPLOAD_DIR:-/var/lib/helpdesk/uploads}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-10485760}
      - UPLOAD_MAX_PER_TICKET=${UPLOAD_MAX_PER_TICKET:-5}
      - RATE_LIMIT_GLOBAL_PER_MIN=${RATE_LIMIT_GLOBAL_PER_MIN:-300}
      - RATE_LIMIT_AUTH_PER_MIN=${RATE_LIMIT_AUTH_PER_MIN:-10}
      - API_KEY_RATE_PER_MIN=${API_KEY_RATE_PER_MIN:-60}
      - API_KEY_RATE_PER_HOUR=${API_KEY_RATE_PER_HOUR:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SEED_ON_BOOT=${SEED_ON_BOOT:-true}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/contracts/node_modules
      - /app/packages/ui/node_modules
      - uploads_dev:/var/lib/helpdesk/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    container_name: dev_web
    restart: unless-stopped
    ports:
      - '5173:5173'
    networks:
      - dev_network
    environment:
      - VITE_PROXY_TARGET=http://api:5000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/contracts/node_modules
      - /app/packages/ui/node_modules
    depends_on:
      api:
        condition: service_started

networks:
  dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  uploads_dev:

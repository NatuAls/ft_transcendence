x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:15-alpine
    container_name: helpdesk-db-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helpdesk-redis-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    networks:
      - backend_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GHCR_OWNER}/helpdesk-api-${ENV_NAME:-prod}:${GITHUB_SHA:-latest}
    container_name: helpdesk-api-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - SEED_ON_BOOT=false
      - PORT=5000
      - UPLOAD_DIR=/var/lib/helpdesk/uploads
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      # Lista EXACTA de orígenes que pueden mandar peticiones con credenciales.
      # Sin esta variable, env.ts cae en su valor por defecto
      # (http://localhost:5173) y la política CORS del entorno queda descrita
      # con los dominios de desarrollo. La inyecta el pipeline desde la
      # variable de repositorio STAGING_CORS_ORIGINS / PROD_CORS_ORIGINS.
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Correo real del entorno. Mailpit sólo existe en compose.dev.yml, así
      # que sin esto SMTP_HOST cae por defecto a "mailpit", un host que no
      # existe aquí, y /api/health/ready reporta el correo como degradado.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - MAIL_FROM=${MAIL_FROM:-HelpDesk Lite <no-reply@helpdesk.local>}
      # GIT_COMMIT y BUILD_TIME NO se declaran aquí a propósito: van horneados
      # en la imagen como build-args (apps/api/Dockerfile.prod). Así
      # GET /api/version describe el artefacto que está corriendo y no lo que
      # dice un fichero .env del servidor, que puede haber cambiado después.
    networks:
      - backend_network
      - proxy-tier
    volumes:
      - uploads:/var/lib/helpdesk/uploads
    # Sonda de VIDA, no de preparación, y es deliberado. /api/health/ready
    # responde 200 aunque PostgreSQL esté caído (el estado real va en el
    # cuerpo), así que como healthcheck no aporta señal: sólo añade cuatro
    # viajes a dependencias —incluido un handshake SMTP— cada 15 segundos.
    # El estado de las dependencias se comprueba leyendo el cuerpo en
    # scripts/deploy/smoke.mjs, después de cada despliegue.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'http_proxy= https_proxy= wget --spider -q http://127.0.0.1:5000/api/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_OWNER}/helpdesk-web-${ENV_NAME:-prod}:${GITHUB_SHA:-latest}
    container_name: helpdesk-web-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    networks:
      - backend_network
      - proxy-tier
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'http_proxy= https_proxy= wget --spider -q http://127.0.0.1 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:15-alpine
    container_name: helpdesk-backup-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    networks:
      - backend_network
    # El fichero .env del servidor declara DB_USER / DB_PASSWORD / DB_NAME,
    # pero backup.sh y pg_dump esperan los nombres POSTGRES_*. Sin esta
    # traducción el cron corría cada noche y dejaba un dump vacío sin avisar.
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      # Montaje de FICHERO: si scripts/backup.sh no existe en el servidor,
      # Docker crea un DIRECTORIO con ese nombre y el entrypoint falla. El
      # script de despliegue lo descarga antes de levantar la pila.
      - ./scripts/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
    # El script se monta en sólo lectura, así que se invoca con `sh /backup.sh`
    # en vez de hacerle chmod +x (que fallaría sobre un montaje :ro).
    entrypoint:
      [
        'sh',
        '-c',
        "echo '0 0 * * * sh /backup.sh >> /backups/cron.log 2>&1' > /etc/crontabs/root && crond -f -d 8",
      ]

networks:
  backend_network:
    driver: bridge
  proxy-tier:
    external: true

volumes:
  postgres_data:
    name: postgres_data_${ENV_NAME:-prod}
  redis_data:
    name: redis_data_${ENV_NAME:-prod}
  uploads:
    name: uploads_${ENV_NAME:-prod}

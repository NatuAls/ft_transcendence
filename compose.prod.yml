x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:15-alpine
    container_name: helpdesk-db-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helpdesk-redis-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    # Techo de memoria explícito. Sin `maxmemory`, redis_memory_max_bytes=0 y
    # la alerta RedisSinMemoria divide por cero. `volatile-lru` sólo expulsa
    # claves CON caducidad (ventanas de rate limit, presencia, tokens revocados
    # que caducan solos): nunca una clave permanente. Para este proyecto
    # 256 MB sobran (uso real: ~1,4 MB).
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    networks:
      - backend_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GHCR_OWNER}/helpdesk-api-${ENV_NAME:-prod}:${GITHUB_SHA:-latest}
    container_name: helpdesk-api-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - SEED_ON_BOOT=false
      - PORT=5000
      - UPLOAD_DIR=/var/lib/helpdesk/uploads
      # Mínimo privilegio (auditoría B4). La APLICACIÓN se conecta con
      # DB_APP_USER/DB_APP_PASSWORD (rol helpdesk_app: sólo DML) y las
      # MIGRACIONES con el propietario (DB_USER). Si DB_APP_PASSWORD no está
      # definida, la app sigue usando el propietario (comportamiento anterior).
      # Activación: scripts/ops/create-app-role.sql + secreto *_DB_APP_PASSWORD.
      - DATABASE_URL=postgresql://${DB_APP_USER:-${DB_USER}}:${DB_APP_PASSWORD:-${DB_PASSWORD}}@db:5432/${DB_NAME}?schema=public
      - MIGRATE_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      # Lista EXACTA de orígenes que pueden mandar peticiones con credenciales.
      # Sin esta variable, env.ts cae en su valor por defecto
      # (http://localhost:5173) y la política CORS del entorno queda descrita
      # con los dominios de desarrollo. La inyecta el pipeline desde la
      # variable de repositorio STAGING_CORS_ORIGINS / PROD_CORS_ORIGINS.
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # NUEVO (tarea 9): habilita GET /api/metrics para Prometheus y la vista
      # de operador de /api/health/status. Si no se define, el endpoint de
      # métricas responde 404 y la página de estado sólo sirve el semáforo
      # público. Generar con: openssl rand -hex 32
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Primer administrador (auditoría §6.3): si no hay ningún GLOBAL_ADMIN,
      # el arranque promociona al usuario registrado con este correo. Vacío =
      # no hace nada. La inyecta el pipeline desde la variable de repositorio
      # STAGING_BOOTSTRAP_ADMIN_EMAIL / PROD_BOOTSTRAP_ADMIN_EMAIL.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      # Correo del entorno. El servicio `mailpit` de abajo existe en la red
      # interna: con SMTP_HOST=mailpit (el valor por defecto) los correos de
      # verificación, recuperación, invitación y RGPD salen de verdad y se
      # pueden ver en su interfaz por túnel SSH.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - MAIL_FROM=${MAIL_FROM:-HelpDesk Lite <no-reply@helpdesk.local>}
      # GIT_COMMIT y BUILD_TIME NO se declaran aquí a propósito: van horneados
      # en la imagen como build-args (apps/api/Dockerfile.prod). Así
      # GET /api/version describe el artefacto que está corriendo y no lo que
      # dice un fichero .env del servidor, que puede haber cambiado después.
    networks:
      - backend_network
      - proxy-tier
    volumes:
      - uploads:/var/lib/helpdesk/uploads
    # Sonda de VIDA, no de preparación, y es deliberado. /api/health/ready
    # responde 200 aunque PostgreSQL esté caído (el estado real va en el
    # cuerpo), así que como healthcheck no aporta señal: sólo añade cuatro
    # viajes a dependencias —incluido un handshake SMTP— cada 15 segundos.
    # El estado de las dependencias se comprueba leyendo el cuerpo en
    # scripts/deploy/smoke.mjs, después de cada despliegue.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'http_proxy= https_proxy= wget --spider -q http://127.0.0.1:5000/api/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Buzón de pruebas (tarea 9 / hallazgo B8 de la auditoría). Hasta ahora
  # SMTP_HOST apuntaba a un host que no existía en el servidor: verificación
  # de cuenta, recuperación de contraseña, invitaciones y confirmaciones RGPD
  # no salían a ninguna parte y /api/health/status marcaba el correo como
  # degradado. Mailpit recibe todo y lo muestra en una interfaz web que sólo
  # escucha en 127.0.0.1 del host: se llega por túnel SSH
  # (ssh -L 8025:127.0.0.1:8025 ...). Nada se entrega a internet.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: helpdesk-mailpit-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - backend_network
    ports:
      # Dos entornos en el mismo host: cada uno con su puerto de UI
      # (8025 prod, 8026 staging; lo fija remote-deploy.sh).
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  web:
    image: ghcr.io/${GHCR_OWNER}/helpdesk-web-${ENV_NAME:-prod}:${GITHUB_SHA:-latest}
    container_name: helpdesk-web-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    networks:
      - backend_network
      - proxy-tier
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'http_proxy= https_proxy= wget --spider -q http://127.0.0.1 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:15-alpine
    container_name: helpdesk-backup-${ENV_NAME:-prod}
    restart: always
    logging: *default-logging
    networks:
      - backend_network
    # El fichero .env del servidor declara DB_USER / DB_PASSWORD / DB_NAME,
    # pero backup.sh y pg_dump esperan los nombres POSTGRES_*. Sin esta
    # traducción el cron corría cada noche y dejaba un dump vacío sin avisar.
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Etiqueta `env` de las métricas que deja backup.sh. Sin ella, prod y
      # staging escribirían series idénticas y node-exporter no podría
      # distinguirlas.
      BACKUP_ENV: ${ENV_NAME:-prod}
      # ---- NUEVO (tarea 8) --------------------------------------------------
      # Frase de cifrado del dump y de los adjuntos. SIN ella backup.sh v2
      # aborta: se prefiere no tener copia a tener una copia en claro con
      # datos personales de los usuarios en el disco de la instancia.
      # Generar con: openssl rand -base64 48
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?define BACKUP_ENCRYPTION_KEY en el .env del servidor}
      # Destino FUERA del host. Vacío = sólo copia local (y backup.sh avisa).
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: /rclone/rclone.conf
      BACKUP_METRICS_FILE: /backups/metrics/backup.prom
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      # Montaje de FICHERO: si scripts/backup.sh no existe en el servidor,
      # Docker crea un DIRECTORIO con ese nombre y el entrypoint falla. El
      # script de despliegue lo descarga antes de levantar la pila.
      - ./scripts/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
      # Configuración de rclone en SÓLO LECTURA: contiene las credenciales del
      # bucket y el contenedor no tiene por qué poder reescribirlas.
      - ./rclone:/rclone:ro
    # El script se monta en sólo lectura, así que se invoca con `sh /backup.sh`
    # en vez de hacerle chmod +x (que fallaría sobre un montaje :ro).
    #
    # 00:00 copia completa. La segunda línea NO es una copia: comprueba a
    # media mañana que la de la noche existe y no es antigua, y refresca la
    # métrica que lee Prometheus aunque el contenedor se haya reiniciado.
    entrypoint:
      [
        'sh',
        '-c',
        "mkdir -p /backups/metrics && printf '0 0 * * * sh /backup.sh >> /backups/cron.log 2>&1\\n30 9 * * * find /backups -maxdepth 1 -type d -name \"20*\" -mtime -2 | grep -q . || echo \"[aviso] sin copias en las ultimas 48h\" >> /backups/cron.log\\n' > /etc/crontabs/root && crond -f -d 8",
      ]

networks:
  backend_network:
    driver: bridge
    # NUEVO: nombre explícito y estable. compose.observability.yml se enchufa a
    # esta red como `external` para que los exportadores de PostgreSQL y Redis
    # puedan consultarlos SIN publicar un solo puerto nuevo. Sin `name:`,
    # Compose la llamaría `<carpeta>_backend_network`, que depende de cómo se
    # haya clonado el proyecto en el servidor.
    name: ${ENV_NAME:-prod}_backend_network
  proxy-tier:
    external: true

volumes:
  postgres_data:
    name: postgres_data_${ENV_NAME:-prod}
  redis_data:
    name: redis_data_${ENV_NAME:-prod}
  uploads:
    name: uploads_${ENV_NAME:-prod}

services:
  db:
    image: postgres:15-alpine
    container_name: prod_database
    restart: always
    env_file:
      - .env
    networks:
     - backend_network
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    networks:
      - backend_network
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
    container_name: prod_api
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - SEED_ON_BOOT=false
      - PORT=5000
      - UPLOAD_DIR=/var/lib/helpdesk/uploads
    networks:
      - backend_network
    volumes:
      - uploads_prod:/var/lib/helpdesk/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.prod
    container_name: prod_web
    restart: always
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/certs:/etc/nginx/ssl:ro
    networks:
      - backend_network
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

networks:
  backend_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  uploads_prod:
<!--
  Icono del sitio. Es el mismo trazado que `BrandMark` de packages/ui, con el
  fondo que allí pone la clase contenedora: así la pestaña y la marca dentro de
  la aplicación son la misma cosa y no dos dibujos parecidos.

  SVG y no .ico a propósito: una sola copia nítida a cualquier tamaño, y es lo
  que entienden los navegadores de hoy. Para los que no, queda el .png de 180
  que pide iOS y que sirve de reserva.
-->

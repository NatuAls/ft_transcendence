# =============================================================================
#  Nginx del contenedor `web` — v2 endurecida
#
#  SUSTITUYE a apps/web/nginx.conf.
#
#  Qué faltaba en la v1 y por qué importa:
#
#    · NINGUNA cabecera de seguridad. El navegador no recibía CSP, ni
#      X-Frame-Options, ni Referrer-Policy: la aplicación se podía embeber en
#      un iframe de otro sitio (clickjacking sobre el formulario de login) y
#      cualquier XSS tenía vía libre para exfiltrar a otro dominio.
#    · Ningún rate limit en el proxy. La tarea 10 lo pide explícitamente
#      («rate limiting también en el proxy»): el de la API es bueno, pero se
#      paga después de haber aceptado la conexión, parseado el cuerpo y
#      consultado Redis. El del proxy corta antes.
#    · Sin compresión: el bundle de React viajaba entero.
#    · Sin política de caché. Vite genera nombres con huella
#      (index-iEl50sEG.js) que se pueden cachear un año; index.html NO puede
#      cachearse nunca o el usuario se queda con la versión vieja tras cada
#      despliegue. Sin reglas, ambos heredaban el mismo comportamiento.
#    · `server_tokens` activo: la versión exacta de Nginx en cada respuesta.
#
#  Nota sobre el reparto de responsabilidades: delante de este contenedor hay
#  Nginx Proxy Manager y, delante, Cloudflare. Las cabeceras se ponen AQUÍ, en
#  el origen, para que sigan estando aunque mañana se cambie el proxy; NPM sólo
#  debe añadir HSTS (es quien termina TLS). Ver el informe, §9.4.
# =============================================================================

# --- Zonas de rate limit (van en el contexto http, ver nota al final) --------
# 30 req/s por IP con ráfaga de 60 para la navegación normal de una SPA
# (index + bundle + css + iconos + varias llamadas a la API a la vez).
limit_req_zone $binary_remote_addr zone=web_general:10m rate=30r/s;
# Las rutas de credenciales, mucho más apretadas: 5 por minuto por IP. Es la
# primera línea contra el relleno de credenciales, antes de tocar la API.
limit_req_zone $binary_remote_addr zone=web_auth:10m rate=5r/m;
# Techo de conexiones simultáneas por IP: frena el "slowloris" barato.
limit_conn_zone $binary_remote_addr zone=web_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# Detrás de NPM y Cloudflare, $remote_addr es el proxy. Sin esto el rate limit
# se aplicaría a TODO el mundo como si fuese una sola IP: a la primera ráfaga,
# 429 para todos. NPM ya reenvía X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de Nginx en cada respuesta ni en las páginas de error.
    server_tokens off;

    # Cuerpos: la API acepta adjuntos de 10 MB (UPLOAD_MAX_BYTES); un margen
    # pequeño evita que el proxy corte antes de que la API pueda responder con
    # su propio error 413, que sí está traducido.
    client_max_body_size 11m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Tiempos por defecto para el proxy hacia la API.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    limit_conn web_conn 24;

    # --- Compresión ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml
        application/manifest+json;

    # --- Cabeceras de seguridad (en TODAS las respuestas) --------------------
    # Definidas en security-headers.inc y repetidas en cada `location` que
    # añade cabeceras propias (ver la nota del include).
    include /etc/nginx/conf.d/security-headers.inc;

    # --- SPA -----------------------------------------------------------------
    # index.html NUNCA se cachea: es el fichero que apunta a los bundles con
    # huella, y cachearlo deja al usuario en la versión anterior tras desplegar.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Activos con huella en el nombre: inmutables, un año.
    location /assets/ {
        # Sin `expires`: añadiría un segundo Cache-Control además de éste.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location / {
        limit_req zone=web_general burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # --- API -----------------------------------------------------------------
    # Rutas de credenciales: cubo propio y mucho más estrecho. Se declara ANTES
    # que /api/ porque Nginx da prioridad a la coincidencia de prefijo más
    # larga entre `location` normales.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|resend-verification) {
        limit_req zone=web_auth burst=5 nodelay;
        proxy_pass http://api:5000;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/ {
        limit_req zone=web_general burst=60 nodelay;
        proxy_pass http://api:5000;
        include /etc/nginx/conf.d/proxy-common.inc;
        # La API decide su propia caché; el proxy no debe inventarse ninguna.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # El endpoint de métricas es interno: Prometheus habla directamente con el
    # contenedor por la red de Docker. Publicarlo por el proxy sería regalar la
    # telemetría a internet aunque lleve token.
    location = /api/metrics { return 404; }

    # --- Tiempo real ---------------------------------------------------------
    location /socket.io {
        proxy_pass http://api:5000;
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Un WebSocket inactivo no debe cerrarse a los 60 s por defecto.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /rt {
        proxy_pass http://api:5000;
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # --- Higiene -------------------------------------------------------------
    # Ficheros ocultos y copias de editor: nunca deben servirse.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ~$ { deny all; }

    # Página de error propia: sin traza, sin versión.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; root /usr/share/nginx/html; }
}

# =============================================================================
#  INSTALACIÓN
#
#  1. Este fichero sigue montándose en /etc/nginx/conf.d/default.conf, pero
#     `limit_req_zone`, `limit_conn_zone` y `set_real_ip_from` sólo son válidos
#     en el contexto `http`. En la imagen oficial de Nginx, conf.d se incluye
#     DENTRO de `http`, así que las tres directivas de zona funcionan tal cual;
#     si en alguna versión diesen «directive is not allowed here», hay que
#     moverlas a un fichero aparte incluido antes, p. ej.
#     /etc/nginx/conf.d/00-zones.conf.
#
#  2. Los dos includes se copian en el Dockerfile junto a este fichero:
#
#         COPY apps/web/nginx.conf            /etc/nginx/conf.d/default.conf
#         COPY apps/web/proxy-common.inc      /etc/nginx/conf.d/proxy-common.inc
#         COPY apps/web/security-headers.inc  /etc/nginx/conf.d/security-headers.inc
#
#  3. Comprobar antes de desplegar:
#         docker run --rm -v "$PWD/apps/web/nginx.conf":/etc/nginx/conf.d/default.conf \
#           -v "$PWD/apps/web/proxy-common.inc":/etc/nginx/conf.d/proxy-common.inc \
#           -v "$PWD/apps/web/security-headers.inc":/etc/nginx/conf.d/security-headers.inc \
#           nginx:1.28-alpine nginx -t
# =============================================================================

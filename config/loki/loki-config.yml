# =============================================================================
#  Loki — almacenamiento de logs con RETENCIÓN (tarea DevOps 9)
#
#  Modo monolítico y sistema de ficheros local: para un host único es la
#  configuración correcta, y evita depender de un almacén de objetos.
# =============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 días. Los logs de una aplicación con datos personales no se guardan
  # "para siempre": el RGPD pide un plazo definido y proporcionado.
  retention_period: 720h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false

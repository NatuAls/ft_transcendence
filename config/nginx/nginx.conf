events {
    worker_connections 1024;
}

http {
    # Seguridad y límites (Tarea 4)
    client_max_body_size 10M;
    
    # ----------------------------------------------------
    # SERVIDOR 1: Escucha en HTTP (80) y REDIRIGE a HTTPS
    # ----------------------------------------------------
    server {
        listen 80;
        server_name localhost;
        
        # Redirección incondicional a HTTPS
        return 301 https://$host:8443$request_uri;
    }

    # ----------------------------------------------------
    # SERVIDOR 2: Escucha en HTTPS (443) y hace de Proxy
    # ----------------------------------------------------
    server {
        listen 443 ssl;
        server_name localhost;

        # Rutas a los certificados que inyecta nuestro volumen
        ssl_certificate /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;
        
        # Opciones de seguridad SSL recomendadas
        ssl_protocols TLSv1.2 TLSv1.3;

        # Enrutar la API al backend Node.js (api)
        location /api/ {
            proxy_pass http://prod_api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Enrutar el Frontend al contenedor Nginx estático (web)
        location / {
            proxy_pass http://prod_web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

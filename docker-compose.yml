services:
  db:
    image: postgres:15-alpine
    container_name: database 
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/conf/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        # healthcheck:
        # test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        # interval: 5s
        # timeout: 5s
        #retries: 10

  backend:
    build: 
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: api-image
    container_name: api
    restart: always
    ports:
      - "5000:5000"
    # Backend fix: carga explícitamente el archivo de variables creado para la API.
    env_file:
      - ./apps/api/.env_api
    environment:
      - PORT=5000
        #volumes:
        #- ./api:/app
        #- /app/node_modules
    depends_on:
      - db
        #        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    image: web-image
    container_name: web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:

services:
  db:
    image: postgres:15-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mi_usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi_password}
      POSTGRES_DB: ${POSTGRES_DB:-mi_base_datos}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/database/conf:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  backend:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: api
    restart: always
    ports:
      - '5000:5000'
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-mi_usuario}:${POSTGRES_PASSWORD:-mi_password}@db:5432/${POSTGRES_DB:-mi_base_datos}
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev_access_secret_change_me_please_32}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me_please_32}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-dev_pepper_change_me}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - MAIL_FROM=${MAIL_FROM:-HelpDesk Lite <no-reply@helpdesk.local>}
      - UPLOAD_DIR=${UPLOAD_DIR:-/var/lib/helpdesk/uploads}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-10485760}
      - UPLOAD_MAX_PER_TICKET=${UPLOAD_MAX_PER_TICKET:-5}
      - RATE_LIMIT_GLOBAL_PER_MIN=${RATE_LIMIT_GLOBAL_PER_MIN:-300}
      - RATE_LIMIT_AUTH_PER_MIN=${RATE_LIMIT_AUTH_PER_MIN:-10}
      - API_KEY_RATE_PER_MIN=${API_KEY_RATE_PER_MIN:-60}
      - API_KEY_RATE_PER_HOUR=${API_KEY_RATE_PER_HOUR:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SEED_ON_BOOT=${SEED_ON_BOOT:-true}
    volumes:
      - uploads:/var/lib/helpdesk/uploads
    depends_on:
      - db
      - redis
      - mailpit

  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: web
    restart: always
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  uploads:
